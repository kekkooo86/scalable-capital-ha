name: Scalable CLI Bridge
version: "1.3.0"
slug: scalable_cli_bridge
description: Read-only HTTP bridge and device-code login for the official Scalable CLI (sc)
url: https://github.com/kekkooo86/scalable-capital-ha
arch:
  - amd64
  - aarch64
init: false
ingress: true
ingress_port: 8788
panel_icon: mdi:chart-timeline-variant
panel_title: Scalable
