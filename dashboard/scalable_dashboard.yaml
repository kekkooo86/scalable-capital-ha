# Example Lovelace dashboard for the Scalable Capital integration.
# Paste into a dashboard's raw configuration editor (needs apexcharts-card,
# button-card, card-mod and layout-card from HACS).
# Requires the helpers in scalable_pl_helpers.yaml.

views:
- title: Scalable
  path: home
  icon: mdi:chart-line
  cards:
  - type: custom:mod-card
    card_mod:
      style: :host { display:block; max-width:480px; margin:0 auto; background:#000; } ha-card { background:#000 !important; border:none !important; box-shadow:none !important; border-radius:0 !important; --vertical-stack-card-gap:0px; }
    card:
      type: vertical-stack
      cards:
      - type: custom:button-card
        show_name: false
        show_icon: false
        show_state: false
        tap_action:
          action: none
        custom_fields:
          main: "[[[\n  const v = parseFloat(states['sensor.scalable_capital_portafoglio_scalable'].state) || 0;\n  const d = parseFloat(states['sensor.scalable_capital_pl_intraday'].state) || 0;\n  const whole = Math.trunc(v);\n  const dec = Math.abs(v - whole).toFixed(2).slice(2);\n  const nf0 = new Intl.NumberFormat('it-IT');\n  const nf2 = new Intl.NumberFormat('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2});\n  const col = d >= 0 ? '#00e676' : '#ff5252';\n  const sign = d >= 0 ? '+' : '';\n  return '<div style=\"padding:14px 22px 8px 22px;\">'\n   + '<div style=\"line-height:1;color:#fff;\">'\n   + '<span style=\"font-size:58px;font-weight:600;letter-spacing:-2px;\">' + nf0.format(whole) + '</span>'\n   + '<sup style=\"font-size:24px;color:#9e9e9e;font-weight:500;\">' + dec + '</sup>'\n   + '<span style=\"font-size:34px;font-weight:300;color:#dcdcdc;margin-left:1px;\">\\u20ac</span>'\n   + '</div>'\n   + '<div style=\"margin-top:8px;font-size:20px;\">'\n   + '<span style=\"color:#dcdcdc;\">Today</span>'\n   + '<span style=\"color:' + col + ';font-weight:600;margin-left:10px;\">' + sign + nf2.format(d) + ' \\u20ac</span>'\n   + '</div>'\n   + '</div>';\n]]]"
        styles:
          card:
          - background: '#000000'
          - box-shadow: none
          - border: none
          - border-radius: '0'
          - padding: '0'
          - margin: '0'
          grid:
          - grid-template-areas: '''main'''
          - grid-template-columns: 1fr
          custom_fields:
            main:
            - grid-area: main
            - padding: '0'
      - type: conditional
        conditions:
        - condition: state
          entity: input_select.scalable_range
          state: 1D
        card:
          type: custom:apexcharts-card
          graph_span: 1d
          update_interval: 60s
          header:
            show: false
          now:
            show: false
          series:
          - entity: sensor.scalable_capital_pl_intraday
            name: Variazione
            color: '#00e676'
            type: area
            curve: smooth
            stroke_width: 3
            opacity: 1
            extend_to: false
            group_by:
              func: avg
              duration: 5min
            show:
              legend_value: false
          apex_config:
            chart:
              height: 300
              background: '#000000'
              toolbar:
                show: false
              zoom:
                enabled: false
              animations:
                enabled: false
              parentHeightOffset: 0
            grid:
              show: true
              borderColor: '#1c1c1c'
              strokeDashArray: 0
              xaxis:
                lines:
                  show: false
              yaxis:
                lines:
                  show: true
              padding:
                left: 4
                right: 4
            xaxis:
              type: datetime
              labels:
                style:
                  colors: '#9a9a9a'
                  fontSize: 12px
              axisBorder:
                show: false
              axisTicks:
                show: false
            yaxis:
              labels:
                style:
                  colors: '#9a9a9a'
                  fontSize: 13px
                formatter: EVAL:function(v){return Math.round(v);}
              axisBorder:
                show: false
              axisTicks:
                show: false
            legend:
              show: false
            tooltip:
              theme: dark
            markers:
              size: 0
            stroke:
              curve: smooth
              width: 3
            fill:
              type: gradient
              gradient:
                shadeIntensity: 0.4
                opacityFrom: 0.35
                opacityTo: 0.02
                stops:
                - 0
                - 95
          card_mod:
            style: 'ha-card { background: #000 !important; border: none !important; box-shadow: none !important; border-radius: 0 !important; }'
          span:
            start: day
      - type: conditional
